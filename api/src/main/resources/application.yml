spring:
  application:
    name: switch-won

  datasource:
    url: jdbc:h2:mem:switchwon;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  cache:
    type: caffeine
    cache-names:
      - latestExchangeRates
    caffeine:
      spec: maximumSize=8,expireAfterWrite=60s

server:
  port: 8080

# 외부 API (한국수출입은행)
external:
  koreaexim:
    base-url: https://oapi.koreaexim.go.kr
    auth-key: ${KOREAEXIM_AUTH_KEY:pVGNGz83qHKoG4RdYPK3f6qJTcvwyqZJ}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # 평일 매시 0분에 해당 시각이면 외부 API 호출. 그 외엔 직전 row 기반 ±0.3% 랜덤 변동.
    call-hours:
      - 12
      - 15
      - 18
      - 21

# Resilience4j 서킷브레이커
resilience4j:
  circuitbreaker:
    instances:
      koreaeximApi:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /api-docs

logging:
  level:
    root: INFO
    com.switchwon: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-NONE}] %-5level %logger{36} - %msg%n"
